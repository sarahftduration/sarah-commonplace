[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sarah-commonplace"
version = "0.1.0a0"
description = "A shared research notebook and work coordination service"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "starlette>=0.47,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
commonplace = "commonplace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commonplace"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "commonplace/skills"

[tool.hatch.build.targets.sdist]
include = [
  "/.agents/skills",
  "/.python-version",
  "/AGENTS.md",
  "/LICENSE",
  "/README.md",
  "/benchmarks",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
